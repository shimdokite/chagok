  );

  initialStateElement?.remove();

  let state = initialGlobals.widgetState ?? null;

    }

    }

   * @param {Record&lt;string, unknown&gt; | ((previous: Record&lt;string, unknown&gt; | null) =&gt; Record&lt;string, unknown&gt;)} next

   */

    const nextState = typeof next === &quot;function&quot; ? next(state) : next;

      nextState == null ||
      typeof nextState !== &quot;object&quot; ||
      isArray(nextState)

          typeof value === &quot;function&quot; ||
          typeof value === &quot;symbol&quot; ||
          (typeof value === &quot;number&quot; &amp;&amp; !Number.isFinite(value))

    );

      parsedState == null ||
      typeof parsedState !== &quot;object&quot; ||
      isArray(parsedState)

      throw new TypeError(&quot;Widget state must be a JSON object&quot;);

      privateContent: null,

        updates: mocks.map(([name, value]) =&gt; ({
          name,
          revision: 1,
          state: &quot;ready&quot;,
          value: { type: &quot;json&quot;, value },
        })),

    }
    connectorGlobals.visualization = {
      get bindings() {
        return bindings;
      },
      /** @param {string} name @param {(value: unknown) =&gt; void} callback */
      onData(name, callback) {
        if (typeof callback !== &quot;function&quot;) {

    const theme = mediaQuery.matches ? &quot;dark&quot; : &quot;light&quot;;
    root.dataset.theme = theme;
    globalThis.openai = {
      ...globalThis.openai,
      ...connectorGlobals,
      openExternal,
      sendFollowUpMessage,
      setWidgetState,
      theme,
      visualizationStyleVariables: {},
      visualizationTheme: theme,
      widgetState: state,
      statePersistence,
      stateModelContext: &quot;none&quot;,
    };
    globalThis.dispatchEvent(
      new CustomEvent(&quot;openai:set_globals&quot;, {
        detail: { globals: globalThis.openai },
      }),
    );
  };
  const sendHeight = () =&gt; {
    postToHost(&quot;height&quot;, {
      height: Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.body.getBoundingClientRect().height,
        ),
      ),
    });
  };

  globalThis.addEventListener(
    &quot;message&quot;,
    (event) =&gt; {
      const data = apply(getMessageData, event, []);
      const ports = apply(getMessagePorts, event, []);
      const source = apply(getMessageSource, event, []);
      if (
        hostPort != null ||
        source !== parentWindow ||
        typeof data !== &quot;object&quot; ||
        data?.type !== &quot;codex-visualization-initialize&quot; ||
        !isArray(ports) ||
        ports.length !== 1
      ) {
        return;
      }
      apply(stopMessagePropagation, event, []);
      const nextHostPort = ports[0];
      try {
        apply(addHostMessageListener, nextHostPort, [
          &quot;message&quot;,
          (event) =&gt; {
            const data = apply(getMessageData, event, []);
            if (typeof data === &quot;object&quot; &amp;&amp; data?.type === &quot;measure&quot;) {
              sendHeight();

              typeof data === &quot;object&quot; &amp;&amp;
              data?.type === &quot;widget-state-result&quot;

                return;
              }
              const pending = pendingStateWrites.get(id);
              if (pending != null) {
                pendingStateWrites.delete(id);

                if (data.ok === true) {
                  pending.resolve();
                } else {

                }

            }
          },
        ]);

      } catch {
        return;
      }
      hostPort = nextHostPort;
      for (const [id, { serializedState }] of pendingStateWrites) {
        postToHost(&quot;widget-state-write&quot;, { id, state: serializedState });
      }
      sendHeight();
    },
    { capture: true },
  );

  mediaQuery.addEventListener(&quot;change&quot;, syncTheme);
  globalThis.addEventListener(&quot;click&quot;, (event) =&gt; {
    if (event.defaultPrevented) {
      return;
    }

    if (event.target instanceof globalThis.Element) {
      element = event.target;

      element = event.target.parentElement;
    }

    const href = link?.getAttribute(&quot;href&quot;);

      return;
    }
    if (href.startsWith(&quot;#&quot;)) {

        id = decodeURIComponent(href.slice(1));

      }

    @media(max-width:420px){#chagok-prototype .cg-stage{padding:15px 0}#chagok-prototype .cg-phone{border-radius:22px}#chagok-prototype .cg-main{padding:10px 17px 23px}#chagok-prototype .cg-header{padding:17px}#chagok-prototype .cg-admin{padding:17px}#chagok-prototype .cg-preview{padding-right:72px}#chagok-prototype .cg-screen-picker{gap:5px}#chagok-prototype .cg-pill{padding:8px 11px}}
    @media(prefers-reduced-motion:no-preference){#chagok-prototype .cg-primary,#chagok-prototype .cg-secondary{transition:filter .15s}#chagok-prototype .cg-primary:hover,#chagok-prototype .cg-secondary:hover{filter:brightness(.96)}}
  &lt;/style&gt;
  &lt;div class=&quot;cg-preview&quot;&gt;&lt;strong&gt;차곡&lt;/strong&gt;&lt;span class=&quot;cg-caption&quot;&gt;MVP 프로토타입 · 로그인과 데이터는 시연용&lt;/span&gt;&lt;/div&gt;
  &lt;div class=&quot;cg-screen-picker&quot; role=&quot;group&quot; aria-label=&quot;미리 볼 화면&quot;&gt;
    &lt;button class=&quot;cg-pill&quot; data-screen=&quot;login&quot; aria-pressed=&quot;false&quot;&gt;로그인&lt;/button&gt;
    &lt;button class=&quot;cg-pill&quot; data-screen=&quot;home&quot; aria-pressed=&quot;true&quot;&gt;홈&lt;/button&gt;
    &lt;button class=&quot;cg-pill&quot; data-screen=&quot;apply&quot; aria-pressed=&quot;false&quot;&gt;신청&lt;/button&gt;
    &lt;button class=&quot;cg-pill&quot; data-screen=&quot;history&quot; aria-pressed=&quot;false&quot;&gt;내역&lt;/button&gt;
    &lt;button class=&quot;cg-pill&quot; data-screen=&quot;admin&quot; aria-pressed=&quot;false&quot;&gt;담당자 웹&lt;/button&gt;
  &lt;/div&gt;
  &lt;div class=&quot;cg-stage viz-dotted-background&quot;&gt;&lt;div id=&quot;cg-content&quot; style=&quot;display:contents&quot;&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div id=&quot;cg-announcement&quot; class=&quot;cg-caption&quot; style=&quot;margin-top:10px&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;chagok-prototype&#x27;);
    const outlet=root.querySelector(&#x27;#cg-content&#x27;);
    const announcement=root.querySelector(&#x27;#cg-announcement&#x27;);
    const money=n=&gt;new Intl.NumberFormat(&#x27;ko-KR&#x27;).format(n);
    const escape=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const icon=name=&gt;`&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
    const seed=[
      {id:&#x27;demo-3&#x27;,category:&#x27;도서비&#x27;,title:&#x27;업무 역량을 위한 도서&#x27;,merchant:&#x27;차곡서점&#x27;,amount:15000,date:&#x27;2026-11-12&#x27;,status:&#x27;pending&#x27;,reason:&#x27;&#x27;},
      {id:&#x27;demo-2&#x27;,category:&#x27;식비&#x27;,title:&#x27;팀 점심 식사&#x27;,merchant:&#x27;그린키친&#x27;,amount:20000,date:&#x27;2026-11-10&#x27;,status:&#x27;approved&#x27;,reason:&#x27;&#x27;},
      {id:&#x27;demo-1&#x27;,category:&#x27;운동비&#x27;,title:&#x27;운동 이용권&#x27;,merchant:&#x27;웰니스 스튜디오&#x27;,amount:30000,date:&#x27;2026-11-08&#x27;,status:&#x27;rejected&#x27;,reason:&#x27;결제 일자가 보이는 영수증을 첨부해 주세요.&#x27;}
    ];
    let screen=&#x27;home&#x27;,filter=&#x27;all&#x27;,selected=&#x27;demo-3&#x27;,adminSelected=null,toast=&#x27;&#x27;,receipt=false;
    let items=seed.map(x=&gt;({...x}));
    let draft={category:&#x27;식비&#x27;,date:&#x27;2026-11-13&#x27;,amount:&#x27;20000&#x27;,title:&#x27;점심 식사&#x27;};
    const design={radius:20,accent:&#x27;#286347&#x27;};
    const limit=100000;
    const available=()=&gt;limit-items.filter(x=&gt;x.status!==&#x27;rejected&#x27;).reduce((a,x)=&gt;a+x.amount,0);
    const statusText=s=&gt;({pending:&#x27;검토 중&#x27;,approved:&#x27;승인 완료&#x27;,rejected:&#x27;반려&#x27;}[s]);
    const categoryIcon=c=&gt;({&#x27;식비&#x27;:&#x27;utensils&#x27;,&#x27;도서비&#x27;:&#x27;book-open&#x27;,&#x27;운동비&#x27;:&#x27;dumbbell&#x27;}[c]||&#x27;receipt&#x27;);
    const badge=s=&gt;`&lt;span class=&quot;cg-badge ${s}&quot;&gt;${statusText(s)}&lt;/span&gt;`;
    function persist(){
      if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{prototype:&#x27;차곡&#x27;,screen,available:available(),requestCount:items.length},privateContent:{screen,items,draft,receipt,filter,selected}}).catch(()=&gt;{});
    }
    function restore(snapshot){
      const saved=snapshot?.privateContent;
      if(!saved||!Array.isArray(saved.items)||!saved.items.every(x=&gt;x&amp;&amp;typeof x.id===&#x27;string&#x27;&amp;&amp;Number.isSafeInteger(x.amount)&amp;&amp;x.amount&gt;0&amp;&amp;[&#x27;pending&#x27;,&#x27;approved&#x27;,&#x27;rejected&#x27;].includes(x.status)))return;
      items=saved.items.slice(0,30);screen=[&#x27;home&#x27;,&#x27;login&#x27;,&#x27;apply&#x27;,&#x27;history&#x27;,&#x27;detail&#x27;,&#x27;success&#x27;,&#x27;admin&#x27;,&#x27;policy&#x27;].includes(saved.screen)?saved.screen:&#x27;home&#x27;;
      draft=saved.draft&amp;&amp;typeof saved.draft===&#x27;object&#x27;?{...draft,...saved.draft}:draft;receipt=!!saved.receipt;
      filter=[&#x27;all&#x27;,&#x27;pending&#x27;,&#x27;approved&#x27;,&#x27;rejected&#x27;].includes(saved.filter)?saved.filter:&#x27;all&#x27;;selected=saved.selected||&#x27;demo-3&#x27;;
    }
    restore(window.openai?.widgetState);
    const logo=()=&gt;&#x27;&lt;span class=&quot;cg-logo&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;span&gt;&lt;/span&gt;&lt;/span&gt;&#x27;;
    const brand=()=&gt;`&lt;div class=&quot;cg-brand&quot;&gt;${logo()}차곡&lt;/div&gt;`;
    const nav=active=&gt;`&lt;nav class=&quot;cg-bottom&quot; aria-label=&quot;앱 메뉴&quot;&gt;&lt;button data-action=&quot;home&quot; class=&quot;${active===&#x27;home&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;${icon(&#x27;house&#x27;)}홈&lt;/button&gt;&lt;button data-action=&quot;history&quot; class=&quot;${active===&#x27;history&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;${icon(&#x27;clipboard-list&#x27;)}신청 내역&lt;/button&gt;&lt;button data-action=&quot;policy&quot; class=&quot;${active===&#x27;policy&#x27;?&#x27;active&#x27;:&#x27;&#x27;}&quot;&gt;${icon(&#x27;badge-check&#x27;)}복지 안내&lt;/button&gt;&lt;/nav&gt;`;
    function phone(main,{title=&#x27;&#x27;,active=&#x27;home&#x27;,back=false,footer=true}={}){
      return `&lt;section class=&quot;cg-phone&quot; aria-label=&quot;차곡 직원 앱&quot;&gt;&lt;div class=&quot;cg-status&quot;&gt;&lt;span&gt;9:41&lt;/span&gt;&lt;span class=&quot;cg-signal&quot;&gt;${icon(&#x27;signal&#x27;)}${icon(&#x27;wifi&#x27;)}${icon(&#x27;battery-full&#x27;)}&lt;/span&gt;&lt;/div&gt;&lt;header class=&quot;cg-header&quot;&gt;${back?`&lt;button class=&quot;cg-back&quot; data-action=&quot;${screen===&#x27;detail&#x27;?&#x27;history&#x27;:&#x27;home&#x27;}&quot;&gt;${icon(&#x27;chevron-left&#x27;)}${title}&lt;/button&gt;`:brand()}&lt;span class=&quot;cg-company&quot;&gt;${icon(&#x27;building-2&#x27;)}그로브&lt;/span&gt;&lt;/header&gt;&lt;main class=&quot;cg-main&quot;&gt;${main}&lt;/main&gt;${footer?nav(active):&#x27;&#x27;}&lt;/section&gt;`;
    }
    function rows(list){return list.length?list.map(x=&gt;`&lt;button class=&quot;cg-row&quot; data-detail=&quot;${escape(x.id)}&quot;&gt;&lt;span class=&quot;cg-row-icon&quot;&gt;${icon(categoryIcon(x.category))}&lt;/span&gt;&lt;span class=&quot;cg-row-main&quot;&gt;&lt;span class=&quot;cg-row-name&quot;&gt;${escape(x.title)}&lt;/span&gt;&lt;span class=&quot;cg-small cg-muted&quot;&gt;${escape(x.category)} · ${escape(x.date.slice(5).replace(&#x27;-&#x27;,&#x27;.&#x27;))}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;cg-row-side&quot;&gt;&lt;span&gt;${money(x.amount)}원&lt;/span&gt;${badge(x.status)}&lt;/span&gt;&lt;/button&gt;`).join(&#x27;&#x27;):&#x27;&lt;div class=&quot;cg-empty&quot;&gt;아직 해당하는 신청이 없어요.&lt;/div&gt;&#x27;;}
    function receiptView(x){return `&lt;div class=&quot;cg-receipt&quot; aria-label=&quot;예시 영수증&quot;&gt;&lt;div class=&quot;cg-receipt-head&quot;&gt;&lt;h3&gt;${escape(x.merchant||&#x27;그린키친&#x27;)}&lt;/h3&gt;&lt;p class=&quot;cg-muted&quot; style=&quot;margin-top:5px&quot;&gt;시안용 샘플 영수증&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cg-receipt-line&quot;&gt;&lt;span&gt;결제 일자&lt;/span&gt;&lt;span&gt;${escape(x.date)}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cg-receipt-line&quot;&gt;&lt;span&gt;${escape(x.category)}&lt;/span&gt;&lt;span&gt;${money(x.amount)}원&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cg-receipt-line cg-receipt-total&quot;&gt;&lt;span&gt;총 결제 금액&lt;/span&gt;&lt;span&gt;${money(x.amount)}원&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;}
    function detailCard(x){return `&lt;div class=&quot;cg-detail-card&quot;&gt;${badge(x.status)}&lt;div class=&quot;cg-total&quot;&gt;${money(x.amount)}원&lt;/div&gt;&lt;p class=&quot;cg-muted&quot; style=&quot;margin-top:5px&quot;&gt;${escape(x.title)}&lt;/p&gt;&lt;dl class=&quot;cg-dl&quot;&gt;&lt;div&gt;&lt;dt&gt;복지 항목&lt;/dt&gt;&lt;dd&gt;${escape(x.category)}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;사용일&lt;/dt&gt;&lt;dd&gt;${escape(x.date)}&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;신청자&lt;/dt&gt;&lt;dd&gt;도연 · 그로브&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&lt;/div&gt;${x.status===&#x27;rejected&#x27;?`&lt;div class=&quot;cg-note&quot; style=&quot;background:var(--cg-error-bg);color:var(--cg-error)&quot;&gt;&lt;h3 style=&quot;font-size:13px;margin-bottom:5px&quot;&gt;반려 사유&lt;/h3&gt;${escape(x.reason)}&lt;/div&gt;`:&#x27;&#x27;}`;}
    function home(){
      const used=limit-available();
      return phone(`&lt;p class=&quot;cg-greeting&quot;&gt;도연님, 안녕하세요.&lt;/p&gt;&lt;h1 class=&quot;cg-intro&quot;&gt;나를 위한 복지,&lt;br&gt;차곡차곡 누려요.&lt;/h1&gt;&lt;section class=&quot;cg-balance&quot; aria-label=&quot;11월 복지비 한도&quot;&gt;&lt;div class=&quot;cg-balance-top&quot;&gt;&lt;span&gt;11월 사용 가능한 복지비&lt;/span&gt;${icon(&#x27;leaf&#x27;)}&lt;/div&gt;&lt;div class=&quot;cg-amount&quot;&gt;${money(available())}&lt;small&gt;원&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;cg-track&quot; role=&quot;progressbar&quot; aria-label=&quot;신청 및 승인된 복지비&quot; aria-valuenow=&quot;${used}&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100000&quot;&gt;&lt;span style=&quot;width:${used/limit*100}%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cg-balance-foot&quot;&gt;&lt;span class=&quot;cg-muted&quot;&gt;신청·승인 ${money(used)}원&lt;/span&gt;&lt;span&gt;총 100,000원&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;cg-primary cg-action&quot; data-action=&quot;apply&quot;&gt;복지비 신청하기 ${icon(&#x27;arrow-up-right&#x27;)}&lt;/button&gt;&lt;/section&gt;&lt;div class=&quot;cg-stack&quot; style=&quot;margin-top:25px&quot;&gt;&lt;section&gt;&lt;div class=&quot;cg-section-head&quot;&gt;&lt;h3&gt;이런 복지를 사용할 수 있어요&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;cg-benefits&quot;&gt;${[&#x27;식비&#x27;,&#x27;도서비&#x27;,&#x27;운동비&#x27;].map(c=&gt;`&lt;button class=&quot;cg-benefit&quot; data-category=&quot;${c}&quot;&gt;${icon(categoryIcon(c))}${c}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/section&gt;&lt;section&gt;&lt;div class=&quot;cg-section-head&quot;&gt;&lt;h3&gt;최근 신청&lt;/h3&gt;&lt;button class=&quot;cg-text-button&quot; data-action=&quot;history&quot;&gt;전체 보기&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;cg-list&quot;&gt;${rows(items.slice(0,2))}&lt;/div&gt;&lt;/section&gt;&lt;/div&gt;`);
    }
    function login(){return phone(`&lt;div class=&quot;cg-login&quot;&gt;&lt;div&gt;&lt;p class=&quot;cg-greeting&quot;&gt;일하는 당신의 일상에&lt;/p&gt;&lt;h1 style=&quot;margin-top:8px&quot;&gt;작은 여유를&lt;br&gt;차곡차곡.&lt;/h1&gt;&lt;p class=&quot;cg-subtitle&quot;&gt;우리 회사 복지비를 확인하고&lt;br&gt;영수증 한 장으로 간편하게 신청하세요.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cg-illustration&quot; aria-hidden=&quot;true&quot;&gt;&lt;div class=&quot;cg-block&quot;&gt;${icon(&#x27;utensils&#x27;)}든든한 점심&lt;/div&gt;&lt;div class=&quot;cg-block&quot;&gt;${icon(&#x27;book-open&#x27;)}새로운 배움&lt;/div&gt;&lt;div class=&quot;cg-block&quot;&gt;${icon(&#x27;dumbbell&#x27;)}건강한 일상&lt;/div&gt;&lt;/div&gt;&lt;div style=&quot;display:grid;gap:12px&quot;&gt;&lt;button class=&quot;cg-secondary&quot; data-action=&quot;google&quot;&gt;&lt;span class=&quot;cg-google&quot; aria-hidden=&quot;true&quot;&gt;G&lt;/span&gt;Google로 계속하기&lt;/button&gt;&lt;button class=&quot;cg-text-button&quot; data-action=&quot;home&quot;&gt;데모로 둘러보기&lt;/button&gt;&lt;p class=&quot;cg-login-foot&quot;&gt;구글 버튼은 시안에서 홈으로 이동합니다.&lt;br&gt;실제 계정 연결은 진행하지 않아요.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;`,{footer:false});}
